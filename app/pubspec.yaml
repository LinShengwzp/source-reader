name: source_reader
description: Cross-platform source workbench and reader.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_picker: ^12.1.3
  http: ^1.6.0
  enough_convert: ^1.6.0
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1
  json_path: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true
