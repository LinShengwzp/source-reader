name: Flutter CI

on:
  push:
    branches:
      - revival/flutter-workbench
  pull_request:
    branches:
      - revival/flutter-workbench

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter 3.47.0
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"
          test_status=${PIPESTATUS[0]}
          set -e

          if [ "$test_status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "Building native assets failed" "$RUNNER_TEMP/flutter-test.log" \
            && grep -Eq "SocketException|Connection reset|Failed host lookup|download" "$RUNNER_TEMP/flutter-test.log"; then
            echo "Transient SQLite native-asset download failure detected; retrying flutter test once"
            sleep 5
            flutter test
            exit $?
          fi

          exit "$test_status"

      - name: Verify clean worktree and A1 diff
        working-directory: .
        shell: bash
        run: |
          git diff --check 32f9a5a826f78b0609073f9141c4226daee271cf..HEAD
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
