name: Flutter CI

on:
  push:
    branches:
      - revival/flutter-workbench
  pull_request:
    branches:
      - revival/flutter-workbench

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.47.0
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter test; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "flutter test failed on attempt $attempt; retrying after transient native-asset failure"
            sleep 5
          done
