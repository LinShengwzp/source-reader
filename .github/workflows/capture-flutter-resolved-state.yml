name: Capture Flutter Resolved State

on:
  push:
    branches:
      - revival/flutter-workbench

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.47.0
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve with repository hosted source
        run: flutter pub get

      - name: Verify lockfile remains unchanged
        working-directory: .
        run: git diff --exit-code -- app/pubspec.lock
